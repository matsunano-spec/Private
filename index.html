<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff5df">
<title>献立ストック</title>
<style>
*{box-sizing:border-box}html{background:var(--page)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--page);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent}.app{max-width:440px;min-height:100vh;margin:auto;background:var(--shell);box-shadow:0 0 40px #0002;padding-bottom:96px}.header{position:sticky;top:0;z-index:20;padding:20px 20px 15px;background:var(--header);border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.22em;opacity:.6}.title{font-size:24px;font-weight:900;margin:2px 0}.actions{display:flex;gap:9px}.iconbtn{width:42px;height:42px;border-radius:13px}.btn{border:1px solid var(--bc);background:linear-gradient(180deg,var(--soft),color-mix(in srgb,var(--accent) 10%,var(--soft)));color:var(--deep);box-shadow:0 2px 5px color-mix(in srgb,var(--deep) 10%,transparent),inset 0 1px #fff9;font-weight:800;cursor:pointer;transition:transform .08s,box-shadow .08s}.btn:active{transform:translateY(1px) scale(.99);box-shadow:0 1px 2px #0001,inset 0 1px #fff7}.search{position:relative;margin-top:14px}.search span{position:absolute;left:14px;top:14px;opacity:.45}.input{width:100%;border:1px solid var(--input-line);background:var(--input);color:var(--text);border-radius:16px;padding:13px 14px;outline:none}.search .input{padding-left:42px}.input:focus{border-color:var(--focus);box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 15%,transparent)}main{padding:20px}.hero{border:1px solid var(--hero-line);background:var(--hero);color:var(--hero-text);border-radius:27px;padding:20px;box-shadow:0 10px 25px #0001}.hero-row{display:flex;justify-content:space-between;gap:12px}.hero small{opacity:.7}.hero h2{font-size:20px;margin:4px 0}.dice{width:48px;height:48px;border-radius:16px;font-size:22px}.pick{display:none;margin-top:15px;padding:12px;background:#ffffff3d;border:1px solid #ffffff70;border-radius:16px;align-items:center;justify-content:space-between}.chips{display:flex;overflow:auto;gap:8px;margin:22px -20px 0;padding:0 20px 7px;scrollbar-width:none}.chip{height:38px;border-radius:999px;padding:0 13px;white-space:nowrap;opacity:.66}.chip.selected{opacity:1;box-shadow:0 3px 8px #0002,inset 0 1px #fff9}.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px}.row select{max-width:210px}.cards{display:grid;gap:12px}.card{position:relative;overflow:hidden;border:1px solid var(--card-line);background:var(--card);border-radius:23px;padding:16px;box-shadow:0 4px 14px #0000000d}.accentline{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}.cardbody{display:flex;gap:12px}.cat-icon{width:44px;height:44px;flex:none;border-radius:15px;display:grid;place-items:center;background:var(--soft);color:var(--deep);border:1px solid var(--bc);font-size:20px}.grow{min-width:0;flex:1}.cardhead{display:flex;justify-content:space-between}.catname{font-size:11px;font-weight:800;color:var(--deep)}.dishname{font-size:16px;font-weight:800;margin:2px 0}.tools{display:flex;opacity:.55}.tool{border:0;background:none;color:inherit;width:30px;height:30px;cursor:pointer}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:11px;padding:5px 9px;border-radius:999px;background:var(--tag);color:var(--tag-text)}.tag:first-child{background:var(--soft);color:var(--deep)}.recipe{display:inline-flex;align-items:center;gap:5px;margin-top:11px;padding:7px 10px;background:var(--soft);color:var(--deep);border-radius:9px;font-size:12px;font-weight:800;text-decoration:none}.cardfoot{border-top:1px solid var(--line);margin-top:13px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}.date-label{font-size:11px;opacity:.55}.date{font-size:12px;font-weight:700}.cook{height:37px;border-radius:12px;padding:0 13px}.fabwrap{position:fixed;z-index:18;bottom:16px;left:0;right:0;max-width:440px;margin:auto;padding:0 20px}.fab{width:100%;height:55px;border-radius:17px;font-size:15px}.overlay{display:none;position:fixed;inset:0;z-index:40;background:#0008;backdrop-filter:blur(3px)}.overlay.open{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;max-width:440px;max-height:90vh;overflow:auto;margin:auto;background:var(--sheet);color:var(--text);border-radius:29px 29px 0 0;padding:12px 20px calc(28px + env(safe-area-inset-bottom));animation:up .24s ease}.handle{width:48px;height:4px;border-radius:9px;background:#8886;margin:0 auto 17px}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0}.close{border:0;background:none;color:inherit;font-size:22px}.form{display:grid;gap:15px;margin-top:20px}.label{font-size:12px;font-weight:800;margin-bottom:6px}.hint{font-size:11px;opacity:.55;margin-top:5px}.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.catpick{height:50px;border-radius:12px;font-size:11px;opacity:.62}.catpick.selected{opacity:1}.save{height:50px;border-radius:16px}.theme-list{display:grid;gap:10px;margin-top:18px}.theme{display:flex;width:100%;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);text-align:left}.theme.selected{outline:2px solid var(--focus)}.swatch{width:52px;height:52px;border-radius:14px;flex:none}.theme small{opacity:.55}.empty{text-align:center;padding:40px 10px;opacity:.55}@keyframes up{from{transform:translateY(100%)}to{transform:none}}
:root,[data-theme=natural]{--page:#fff5df;--shell:#fffaf0cc;--header:#fffaf0e8;--text:#29323b;--line:#eadfce;--card:#fffdf8;--card-line:#f3dfbd;--input:#fff;--input-line:#ecdcc4;--focus:#ef8a3c;--hero:linear-gradient(135deg,#fff0c8,#f3a44f);--hero-line:#f3bd76;--hero-text:#6d3c12;--sheet:#fffdfb;--tag:#f1f5f9;--tag-text:#64748b}
[data-theme=aurora]{--page:#f7f5ff;--shell:#ffffffb8;--header:#ffffffbf;--text:#4f5068;--line:#e2deed;--card:#ffffffc9;--card-line:#fff;--input:#ffffffd4;--input-line:#fff;--focus:#b4a0db;--hero:linear-gradient(135deg,#f0cfdf,#d8d3ed,#bde2e9);--hero-line:#fff;--hero-text:#574f72;--sheet:#fffdfb;--tag:#f1f1f7;--tag-text:#686a7b}
[data-theme=dark]{--page:#050609;--shell:#080a0f;--header:#080a0fe8;--text:#eee;--line:#292b34;--card:#151821;--card-line:#292c35;--input:#141720;--input-line:#343743;--focus:#22d3ee;--hero:linear-gradient(135deg,#202430,#101219);--hero-line:#353844;--hero-text:#fff;--sheet:#0b0d13;--tag:#242833;--tag-text:#a1a1aa}
[data-theme=green]{--page:#edf9f2;--shell:#f8fffbcc;--header:#f8fffbe8;--text:#29483a;--line:#d8e9df;--card:#ffffffcf;--card-line:#dbeee3;--input:#fff;--input-line:#d4ebde;--focus:#4cae91;--hero:linear-gradient(135deg,#d8f0e1,#8fc7a6);--hero-line:#b9ddc8;--hero-text:#244f39;--sheet:#fbfffc;--tag:#edf5f0;--tag-text:#567565}
[data-theme=cafe]{--page:#e9ddcf;--shell:#f7efe5f2;--header:#f7efe5eb;--text:#4b3429;--line:#e2d0c0;--card:#fffaf3;--card-line:#e1cdbb;--input:#fffaf3;--input-line:#dcc5af;--focus:#9b735c;--hero:linear-gradient(135deg,#d8b99d,#684333);--hero-line:#d4b9a2;--hero-text:#fff;--sheet:#fffaf3;--tag:#f1e3d6;--tag-text:#765b4b}
</style>
</head>
<body><div class="app" id="app">
<header class="header"><div class="top"><div><div class="eyebrow">MENU STOCK</div><div class="title">献立ストック</div></div><div class="actions"><button class="btn iconbtn" id="settingsBtn">⚙</button><button class="btn iconbtn" id="addTop">＋</button></div></div><div class="search"><span>⌕</span><input class="input" id="search" placeholder="料理名・食材名から検索"></div></header>
<main><section class="hero"><div class="hero-row"><div><small>思いつかないときは</small><h2>今日の候補を選ぶ</h2><small>選択中の条件から選びます</small></div><button class="btn dice" id="dice">⚄</button></div><div class="pick" id="pick"><b id="pickName"></b><button class="btn cook" id="pickCook">これにする</button></div></section><div class="chips" id="chips"></div><div class="row"><b><span id="count"></span>件の料理</b><select class="input" id="sort"><option value="oldest">しばらく作っていない順</option><option value="newest">最近作った順</option><option value="name">料理名順</option></select></div><div class="cards" id="cards"></div></main>
<div class="fabwrap"><button class="btn fab" id="addBottom">＋ 料理を追加する</button></div></div>
<div class="overlay" id="formOverlay"><div class="sheet"><div class="handle"></div><div class="sheethead"><h2 id="formTitle">料理を追加</h2><button class="close" data-close>×</button></div><form class="form" id="dishForm"><label><div class="label">料理名</div><input class="input" id="dishName" required placeholder="例：肉じゃが"></label><div><div class="label">カテゴリ</div><div class="catgrid" id="catGrid"></div></div><label><div class="label">食材</div><textarea class="input" id="ingredients" rows="3" placeholder="食材を「、」で区切って入力"></textarea></label><label><div class="label">🔗 レシピURL <span style="opacity:.5;font-weight:400">任意</span></div><input class="input" id="url" type="url" inputmode="url" placeholder="https://example.com/recipe"><div class="hint">レシピ本文は保存せず、参照先だけ登録します</div></label><button class="btn save" type="submit">保存する</button></form></div></div>
<div class="overlay" id="cookOverlay"><div class="sheet"><div class="handle"></div><div class="sheethead"><h2>作った日を記録</h2><button class="close" data-close>×</button></div><h3 id="cookName" style="text-align:center"></h3><input class="input" id="cookDate" type="date"><button class="btn save" id="saveCook" style="width:100%;margin-top:16px">この日付で記録する</button></div></div>
<div class="overlay" id="settingsOverlay"><div class="sheet"><div class="handle"></div><div class="sheethead"><h2>デザイン設定</h2><button class="close" data-close>×</button></div><div class="theme-list" id="themeList"></div></div></div>
<script>
const CATS={"すべて":["🍽","all"],"主食":["🌾","staple"],"主菜":["🍖","main"],"副菜":["🥬","side"],"汁物":["🥣","soup"],"お菓子":["🍬","sweet"],"飲み物":["🥤","drink"],"その他":["🍳","other"]};
const P={natural:{all:["#22b8cf","#e6fcf5","#087f8c"],staple:["#f6ad37","#fff3d6","#9a5b00"],main:["#ef7188","#ffe3e8","#a9364f"],side:["#42b883","#dcf7e9","#18724b"],soup:["#49a9dc","#dff3ff","#17678f"],sweet:["#9b7bdd","#eee8ff","#5e41a0"],drink:["#4d83df","#e3edff","#27569e"],other:["#ef8a3c","#ffead9","#a44d12"]},aurora:{all:["#91cfd6","#e8f8fa","#467e88"],staple:["#e9ad9e","#fff0eb","#9a5f51"],main:["#d890b2","#fce8f2","#8f4768"],side:["#9bcdbc","#e9f7f2","#4e7f70"],soup:["#84bdd6","#e7f5fb","#47758b"],sweet:["#b4a0db","#f0ebfa","#6d5a99"],drink:["#8daee0","#eaf0fb","#506e9d"],other:["#c4a0cf","#f5eafa","#795684"]},dark:{all:["#22d3ee","#102930","#67e8f9"],staple:["#fb923c","#302016","#fdba74"],main:["#f472b6","#301827","#f9a8d4"],side:["#a3e635","#203016","#bef264"],soup:["#38bdf8","#112838","#7dd3fc"],sweet:["#a78bfa","#221c38","#c4b5fd"],drink:["#60a5fa","#17233b","#93c5fd"],other:["#fbbf24","#302814","#fcd34d"]},green:{all:["#4cae91","#e1f5ee","#276f5a"],staple:["#9ebf55","#f0f6dd","#627d27"],main:["#36765b","#deeee7","#1f513d"],side:["#65b96f","#e3f5e5","#357f40"],soup:["#3c9f91","#dff3f0","#246c62"],sweet:["#86a982","#eaf2e8","#556f51"],drink:["#62b9ac","#e2f6f2","#34776d"],other:["#899b50","#f0f2df","#5c692d"]},cafe:{all:["#9b735c","#f2e5da","#5f4031"],staple:["#c38a46","#f8ead4","#7e5425"],main:["#6b4032","#eadbd4","#46271f"],side:["#87905a","#edf0df","#596036"],soup:["#b5997f","#f3e8dc","#745d49"],sweet:["#805344","#eee0da","#533329"],drink:["#9d765f","#f1e4dc","#624838"],other:["#b66e4c","#f6e2d8","#773e28"]}};
const THEME_INFO={natural:["ナチュラル","明るいクリームとオレンジ","linear-gradient(135deg,#fff8e8 55%,#f7b267 55%)"],aurora:["オーロラ","淡いピンク・水色・ラベンダー","linear-gradient(135deg,#fde7f3,#eee9ff,#def5fb)"],dark:["ダーク","黒に鮮やかな光が映えるデザイン","linear-gradient(135deg,#111,#22d3ee)"],green:["グリーン","ミントと若葉の爽やかな色合い","linear-gradient(135deg,#effcf5,#83c9a7)"],cafe:["カフェ","ベージュ・ブラウン・チョコ","linear-gradient(135deg,#f6eadb,#583a2c)"]};
const initial=[{id:1,name:"親子丼",category:"主食",ingredients:["鶏もも肉","卵","玉ねぎ","ごはん"],lastCooked:"2026-08-29",url:""},{id:2,name:"豚の生姜焼き",category:"主菜",ingredients:["豚肉","玉ねぎ","しょうが"],lastCooked:"2026-08-22",url:""},{id:3,name:"ほうれん草のごま和え",category:"副菜",ingredients:["ほうれん草","ごま"],lastCooked:"2026-08-14",url:""},{id:4,name:"豆腐とわかめの味噌汁",category:"汁物",ingredients:["豆腐","わかめ","ねぎ","味噌"],lastCooked:"2026-09-01",url:""},{id:5,name:"鮭のホイル焼き",category:"主菜",ingredients:["鮭","しめじ","玉ねぎ","バター"],lastCooked:null,url:""},{id:6,name:"バナナパウンドケーキ",category:"お菓子",ingredients:["バナナ","卵","小麦粉","バター"],lastCooked:"2026-07-18",url:""}];
let dishes=JSON.parse(localStorage.getItem("menu-stock-dishes")||"null")||initial,theme=localStorage.getItem("menu-stock-theme")||"natural",category="すべて",editing=null,cooking=null,picked=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),today=()=>{let d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)},norm=s=>{s=s.trim();return s&&!/^https?:\/\//i.test(s)?"https://"+s:s};
function colors(name){return P[theme][CATS[name]?.[1]||"other"]}function paint(el,c){el.style.setProperty("--accent",c[0]);el.style.setProperty("--soft",c[1]);el.style.setProperty("--deep",c[2]);el.style.setProperty("--bc",c[0]+"70")}
function saveAll(){localStorage.setItem("menu-stock-dishes",JSON.stringify(dishes))}function open(id){$(id).classList.add("open")}function closeAll(){$$(".overlay").forEach(x=>x.classList.remove("open"))}
function filtered(){let s=$("#search").value.trim();let a=dishes.filter(d=>(category==="すべて"||d.category===category)&&(!s||d.name.includes(s)||d.ingredients.some(i=>i.includes(s))));let sort=$("#sort").value;return a.sort((x,y)=>sort==="name"?x.name.localeCompare(y.name,"ja"):sort==="newest"?(y.lastCooked||"").localeCompare(x.lastCooked||""):!x.lastCooked?-1:!y.lastCooked?1:x.lastCooked.localeCompare(y.lastCooked))}
function render(){document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue('--page').trim();[$("#settingsBtn"),$("#pickCook")].forEach(x=>paint(x,colors("すべて")));[$("#addTop"),$("#addBottom"),$("#saveCook"),$("#dishForm .save")].forEach(x=>paint(x,colors("その他")));paint($("#dice"),colors("お菓子"));$("#chips").innerHTML=Object.keys(CATS).map(n=>{let c=colors(n);return `<button class="btn chip ${n===category?'selected':''}" data-cat="${n}" style="--accent:${c[0]};--soft:${c[1]};--deep:${c[2]};--bc:${c[0]}70">${CATS[n][0]} ${n}</button>`}).join("");let a=filtered();$("#count").textContent=a.length;$("#cards").innerHTML=a.length?a.map(card).join(""):'<div class="empty">該当する料理がありません</div>';$("#catGrid").innerHTML=Object.keys(CATS).slice(1).map(n=>{let c=colors(n);return `<button type="button" class="btn catpick ${n===$("#dishForm").dataset.category?'selected':''}" data-pickcat="${n}" style="--accent:${c[0]};--soft:${c[1]};--deep:${c[2]};--bc:${c[0]}70">${CATS[n][0]}<br>${n}</button>`}).join("");renderThemes()}
function card(d){let c=colors(d.category),days=d.lastCooked?Math.max(0,Math.floor((new Date(today())-new Date(d.lastCooked))/86400000)):null,date=d.lastCooked?new Date(d.lastCooked+"T00:00").toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"}):"まだ作っていません";return `<article class="card" style="--accent:${c[0]};--soft:${c[1]};--deep:${c[2]};--bc:${c[0]}70"><i class="accentline"></i><div class="cardbody"><div class="cat-icon">${CATS[d.category]?.[0]||"🍳"}</div><div class="grow"><div class="cardhead"><div><div class="catname">${esc(d.category)}</div><div class="dishname">${esc(d.name)}</div></div><div class="tools"><button class="tool" data-edit="${d.id}">✎</button><button class="tool" data-delete="${d.id}">⌫</button></div></div><div class="tags">${d.ingredients.map(i=>`<span class="tag">${esc(i)}</span>`).join("")}</div>${d.url?`<a class="recipe" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">↗ レシピを見る</a>`:""}<div class="cardfoot"><div><div class="date-label">◷ 最後に作った日</div><div class="date">${date}${days!==null?` <span style="opacity:.5">（${days}日前）</span>`:""}</div></div><button class="btn cook" data-cook="${d.id}">作った！</button></div></div></div></article>`}
function renderThemes(){$("#themeList").innerHTML=Object.entries(THEME_INFO).map(([k,v])=>`<button class="theme ${k===theme?'selected':''}" data-theme="${k}"><span class="swatch" style="background:${v[2]}"></span><span><b>${v[0]}</b><br><small>${v[1]}</small></span>${k===theme?'<b style="margin-left:auto">✓</b>':''}</button>`).join("")}
function openForm(d=null){editing=d?.id||null;$("#formTitle").textContent=d?"料理を編集":"料理を追加";$("#dishName").value=d?.name||"";$("#ingredients").value=d?.ingredients?.join("、")||"";$("#url").value=d?.url||"";$("#dishForm").dataset.category=d?.category||(category==="すべて"?"主菜":category);open("#formOverlay");render()}
function openCook(d){cooking=d.id;$("#cookName").textContent=d.name;$("#cookDate").value=today();open("#cookOverlay")}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.close!==undefined)closeAll();if(b.dataset.cat){category=b.dataset.cat;picked=null;$("#pick").style.display="none";render()}if(b.dataset.pickcat){$("#dishForm").dataset.category=b.dataset.pickcat;render()}if(b.dataset.edit)openForm(dishes.find(d=>d.id==b.dataset.edit));if(b.dataset.delete&&confirm("この料理を削除しますか？")){dishes=dishes.filter(d=>d.id!=b.dataset.delete);saveAll();render()}if(b.dataset.cook)openCook(dishes.find(d=>d.id==b.dataset.cook));if(b.dataset.theme){theme=b.dataset.theme;localStorage.setItem("menu-stock-theme",theme);render()}});
$("#addTop").onclick=$("#addBottom").onclick=()=>openForm();$("#settingsBtn").onclick=()=>open("#settingsOverlay");$("#search").oninput=render;$("#sort").onchange=render;$("#dice").onclick=()=>{let a=filtered();if(!a.length)return;picked=a[Math.floor(Math.random()*a.length)];$("#pickName").textContent=picked.name;$("#pick").style.display="flex"};$("#pickCook").onclick=()=>picked&&openCook(picked);$("#dishForm").onsubmit=e=>{e.preventDefault();let v={name:$("#dishName").value.trim(),category:e.currentTarget.dataset.category,ingredients:$("#ingredients").value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean),url:norm($("#url").value)};if(!v.name)return;if(editing)dishes=dishes.map(d=>d.id===editing?{...d,...v}:d);else dishes.unshift({id:Date.now(),...v,lastCooked:null});saveAll();closeAll();render()};$("#saveCook").onclick=()=>{let dt=$("#cookDate").value;if(!dt)return;dishes=dishes.map(d=>d.id===cooking?{...d,lastCooked:dt}:d);saveAll();closeAll();render()};$$('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeAll()}));render();
</script></body></html>
