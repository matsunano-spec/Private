const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),iso=d=>{let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)},fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('ja-JP',{month:'short',day:'numeric'}):'未作成';
let raw;try{raw=JSON.parse(localStorage.getItem('menu-stock-dishes')||'null')}catch{}let dishes=(raw||sample).map(d=>({...d,genres:(d.genres||[]).map(g=>GENRES.includes(g)?g:'その他').filter((g,i,a)=>a.indexOf(g)===i),ingredients:d.ingredients||[],materials:d.materials||'',recipe:d.recipe||'',url:d.url||''}));let plans={};try{plans=JSON.parse(localStorage.getItem('menu-stock-plans')||'{}')}catch{}let shopping=[];try{shopping=JSON.parse(localStorage.getItem('menu-stock-shopping')||'[]');if(!Array.isArray(shopping))shopping=[];shopping=shopping.map(x=>({...x,checked:!!x.checked}))}catch{shopping=[]}let theme=({green:'sakura',cafe:'maple',cool:'marine'}[localStorage.getItem('menu-stock-theme')]||localStorage.getItem('menu-stock-theme')||'natural'),page='list',cat='すべて',genre='すべて',sort='oldest',selectedDate=null,month=new Date(),editing=null,formGenres=[],formCat='主菜',shuffled=[],shuffleGenre='';
function color(c){return A[theme][KEY[c]||'other']}function save(){localStorage.setItem('menu-stock-dishes',JSON.stringify(dishes));localStorage.setItem('menu-stock-plans',JSON.stringify(plans));localStorage.setItem('menu-stock-shopping',JSON.stringify(shopping));localStorage.setItem('menu-stock-theme',theme)}function open(id){$(id).classList.add('open')}function close(){$$('.overlay').forEach(x=>x.classList.remove('open'))}function list(){let q=$('#search').value.trim(),x=dishes.filter(d=>(cat==='すべて'||d.category===cat)&&(genre==='すべて'||dishGenres(d).includes(genre))&&(!q||d.name.includes(q)||d.ingredients.some(i=>i.includes(q))||d.genres.some(g=>g.includes(q))));return x.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name,'ja'):sort==='newest'?(b.lastCooked||'').localeCompare(a.lastCooked||''):!a.lastCooked?-1:!b.lastCooked?1:(a.lastCooked||'').localeCompare(b.lastCooked||''))}
function render(){document.documentElement.dataset.theme=theme;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#search').style.display=page==='list'?'block':'none';$('#listAddFixed').classList.toggle('show',page==='list');$('#view').innerHTML=page==='list'?listView():page==='calendar'?calendarView():page==='recipes'?recipesView():shoppingView();bindDynamic()}
function listView(){let l=list();return `<div class="page">${selectedDate?`<div class="mode"><div class="between"><div><b>${new Date(selectedDate+'T00:00').toLocaleDateString('ja-JP')}に登録</b><div class="tiny muted">検索・絞り込み後、「この日に追加」を押してください</div></div><button class="pill" id="finish">完了</button></div></div>`:''}<section class="hero"><div class="between"><div><div class="tiny muted">${cat==='すべて'?'同じジャンルの主菜・副菜・汁物を選択':'選択中の条件から候補を選択'}</div><h2>ランダム献立</h2><div class="tiny muted">登録がないカテゴリは飛ばします</div></div><button class="spark" id="shuffle" aria-label="献立をシャッフル">${UI.sparkle}</button></div>${shuffled.length?`<div class="shuffle-results"><b class="tiny">#${shuffleGenre} の候補</b>${shuffled.map(d=>`<div class="shuffle-item"><span><small>${d.category}</small><br><b>${esc(d.name)}</b></span>${selectedDate?`<button class="action" data-assign="${d.id}">追加</button>`:''}</div>`).join('')}<button class="save" id="allAssign">${selectedDate?'すべて追加':'日付を選んで登録'}</button></div>`:''}</section><div class="filter-panel"><span class="filter-label">カテゴリ</span><div class="scroller">${CATS.map(c=>`<button class="pill ${c===cat?'active':''}" data-cat="${c}" style="--accent:${color(c)}">${c===cat?'✓ ':''}${ICON[c]} ${c}</button>`).join('')}</div><span class="filter-label" style="margin-top:7px">ジャンル</span><div class="scroller" style="margin-top:0"><button class="pill genre ${genre==='すべて'?'active':''}" data-genre="すべて">全ジャンル</button>${GENRES.map(g=>`<button class="pill genre ${g===genre?'active':''}" data-genre="${g}">#${g}</button>`).join('')}</div></div><div class="toolbar"><b>${l.length}件</b><select id="sort"><option value="oldest">しばらく作っていない順</option><option value="newest">最近作った順</option><option value="name">料理名順</option></select></div><div class="cards">${l.length?l.map(card).join(''):'<div class="empty">該当する料理がありません</div>'}</div></div>`}
function card(d){let c=color(d.category),already=selectedDate&&(plans[selectedDate]||[]).includes(d.id);return `<article class="card" style="--accent:${c}"><i class="bar"></i><div class="cardrow"><div class="caticon">${ICON[d.category]}</div><div class="grow"><div class="between"><div class="grow"><small style="color:${c};font-weight:900">${d.category}</small><div class="name">${esc(d.name)}</div></div><div class="tools"><button class="tool" data-edit="${d.id}" aria-label="編集">${UI.edit}</button><button class="tool" data-del="${d.id}" aria-label="削除">${UI.trash}</button></div></div><div class="tags">${d.genres.map(g=>`<span class="tag genretag">#${g}</span>`).join('')}</div><div class="tags">${d.ingredients.map(i=>`<span class="tag">${esc(i)}</span>`).join('')}</div>${d.materials||d.recipe||d.url?`<button class="linkbtn" data-recipe="${d.id}">${UI.recipe} レシピを見る</button>`:''}<div class="cardfoot"><div class="date"><small class="muted">最後に作った日</small><b>${fmt(d.lastCooked)}</b></div>${selectedDate?`<button class="action" data-assign="${d.id}" ${already?'disabled':''}>${already?'追加済み':'この日に追加'}</button>`:`<button class="action" data-today="${d.id}">今日に登録</button>`}</div></div></div></article>`}
function calendarView(){let y=month.getFullYear(),m=month.getMonth(),blank=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),cells=[...Array(blank).fill(null),...Array.from({length:days},(_,i)=>new Date(y,m,i+1))];return `<div class="page"><div class="calendar-head"><button class="icon svgbtn" id="prev" aria-label="前月">${UI.left}</button><b>${y}年 ${m+1}月</b><button class="icon svgbtn" id="next" aria-label="翌月">${UI.right}</button></div><p class="tiny muted" style="text-align:center">日付を押すと一覧画面で献立を選べます</p><div class="week">${'日月火水木金土'.split('').map(x=>`<div>${x}</div>`).join('')}</div><div class="cal">${cells.map((d,i)=>{if(!d)return'<div class="day"></div>';let dt=iso(d),items=(plans[dt]||[]).map(id=>dishes.find(x=>x.id===id)).filter(Boolean);return`<button class="day ${dt===iso(new Date())?'today':''}" data-date="${dt}"><b>${d.getDate()}</b>${items.slice(0,3).map(x=>`<div class="event" style="background:${color(x.category)}">${esc(x.name)}</div>`).join('')}${items.length>3?`<small>+${items.length-3}</small>`:''}</button>`}).join('')}</div></div>`}
function recipesView(){let x=dishes.filter(d=>d.materials||d.recipe||d.url);return `<div class="page"><h2>レシピノート</h2><p class="tiny muted">詳しい材料・作り方・URLを確認できます</p><div class="recipes">${x.length?x.map(d=>`<button class="recipe-row" data-recipe="${d.id}"><span class="caticon" style="--accent:${color(d.category)}">${ICON[d.category]}</span><span class="grow"><b>${esc(d.name)}</b><br><small class="muted">${d.materials?'材料 ':''}${d.recipe?'・作り方 ':''}${d.url?'・URL':''}</small></span><b class="rowarrow">${UI.right}</b></button>`).join(''):'<div class="empty">レシピは未登録です</div>'}</div></div>`}
function shoppingView(){let checkedCount=shopping.filter(x=>x.checked).length;return `<div class="page"><div class="shopping-head"><h2>買い物リスト</h2><div class="between">${checkedCount?`<span class="shopping-selection">${checkedCount}件選択中</span>`:''}<button id="deleteChecked" class="shopping-trash" ${checkedCount?'':'disabled'} aria-label="チェック済みを削除">${UI.trash}</button></div></div><form id="shoppingForm" class="shopping-form"><input id="shoppingName" class="field" placeholder="商品名" required><input id="shoppingAmount" class="field" placeholder="数・グラムなど"><button class="shopping-add" aria-label="買い物を追加">${UI.plus}</button></form><div class="shopping-note">例：玉ねぎ ／ 2個　　鶏もも肉 ／ 300g</div><div class="shopping-list">${shopping.length?shopping.map(x=>`<div class="shopping-item ${x.checked?'checked':''}"><button class="shopping-check ${x.checked?'checked':''}" data-shop-toggle="${x.id}" aria-label="購入状態を切り替える">${UI.check}</button><span class="shopping-name">${esc(x.name)}</span>${x.amount?`<span class="shopping-amount">${esc(x.amount)}</span>`:''}</div>`).join(''):'<div class="empty">買うものはありません</div>'}</div></div>`}function addShopping(){let name=$('#shoppingName')?.value.trim(),amount=$('#shoppingAmount')?.value.trim();if(!name)return;shopping.push({id:Date.now(),name,amount,checked:false});save();render()}function dishGenres(d){return d.genres&&d.genres.length?d.genres:['その他']}function shuffle(){let eligible=dishes.filter(d=>cat==='すべて'?SHUFFLE.includes(d.category):d.category===cat);let tg=genre;if(tg==='すべて'){let av=GENRES.filter(g=>eligible.some(d=>dishGenres(d).includes(g)));if(!av.length){shuffled=[];shuffleGenre='';alert('選択条件に合う料理がありません');render();return}tg=av[Math.floor(Math.random()*av.length)]}eligible=eligible.filter(d=>dishGenres(d).includes(tg));if(cat==='すべて'){shuffled=SHUFFLE.map(c=>{let p=eligible.filter(d=>d.category===c);return p.length?p[Math.floor(Math.random()*p.length)]:null}).filter(Boolean)}else shuffled=eligible.length?[eligible[Math.floor(Math.random()*eligible.length)]]:[];shuffleGenre=tg;if(!shuffled.length)alert('選択条件に合う料理がありません');render()}
function bindDynamic(){let sf=$('#shoppingForm');if(sf)sf.onsubmit=e=>{e.preventDefault();addShopping()};let dc=$('#deleteChecked');if(dc)dc.onclick=()=>{if(!shopping.some(x=>x.checked))return;if(confirm('チェック済みの項目を削除しますか？')){shopping=shopping.filter(x=>!x.checked);save();render()}};let s=$('#sort');if(s){s.value=sort;s.onchange=e=>{sort=e.target.value;render()}}$('#shuffle')&&($('#shuffle').onclick=shuffle);$('#finish')&&($('#finish').onclick=()=>{selectedDate=null;render()});$('#allAssign')&&($('#allAssign').onclick=()=>{if(selectedDate){shuffled.forEach(d=>assign(d.id));render()}else{$('#shuffleRegisterDate').value=iso(new Date());open('#shuffleDateOv')}});$('#prev')&&($('#prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()});$('#next')&&($('#next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()})}
function assign(id){plans[selectedDate]=[...(plans[selectedDate]||[]).filter(x=>x!==id),id];save()}function openForm(d){editing=d?.id||null;formCat=d?.category||(cat==='すべて'?'主菜':cat);formGenres=d?.genres?[...d.genres]:(genre==='すべて'?[]:[genre]);$('#formTitle').textContent=d?'料理を編集':'料理を追加';$('#fName').value=d?.name||'';$('#fTags').value=d?.ingredients?.join('、')||'';$('#fMaterials').value=d?.materials||'';$('#fRecipe').value=d?.recipe||'';$('#fUrl').value=d?.url||'';renderFormPicks();open('#formOv')}
function renderFormPicks(){$('#fCats').innerHTML=CATS.slice(1).map(c=>`<button type="button" class="pick ${c===formCat?'active':''}" data-fcat="${c}" style="--accent:${color(c)}">${ICON[c]}<span>${c}</span></button>`).join('');$('#fGenres').innerHTML=GENRES.map(g=>`<button type="button" class="pill ${formGenres.includes(g)?'active':''}" data-fgenre="${g}" style="--accent:var(--primary)">${formGenres.includes(g)?'✓ ':''}${g}</button>`).join('')}
function showRecipe(d){$('#rTitle').textContent=d.name;$('#rContent').innerHTML=`${d.materials?`<div class="recipebox" style="background:var(--soft)"><b>詳しい材料・分量</b><br><br>${esc(d.materials)}</div>`:''}${d.recipe?`<div class="recipebox"><b>作り方</b><br><br>${esc(d.recipe)}</div>`:''}${d.url?`<a class="save" style="display:block;text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${esc(d.url)}">外部レシピを開く</a>`:''}<button class="save" id="editRecipe">材料・作り方を編集</button>`;$('#editRecipe').onclick=()=>{close();openForm(d)};open('#recipeOv')}
function renderThemes(){$('#themes').innerHTML=Object.entries(TN).map(([k,n])=>{let v=THEME_PREVIEW[k],on=theme===k;return `<button class="theme-choice ${on?'selected':''}" data-theme="${k}" style="--theme-color:${A[k].all}"><span class="theme-preview" style="background:${v.bg}"><span class="theme-preview-icon">${UI[v.icon]}</span><span class="theme-dots">${v.dots.map(c=>`<i style="background:${c}"></i>`).join('')}</span></span><span class="theme-copy"><b>${n}</b><small>${v.note}</small></span><span class="theme-check">${on?'✓':''}</span></button>`}).join('')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.classList.contains('close'))close();if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.shopToggle){shopping=shopping.map(x=>x.id==b.dataset.shopToggle?{...x,checked:!x.checked}:x);save();render()}if(b.dataset.cat){cat=b.dataset.cat;shuffled=[];render()}if(b.dataset.genre){genre=b.dataset.genre;shuffled=[];render()}if(b.dataset.edit)openForm(dishes.find(d=>d.id==b.dataset.edit));if(b.dataset.del&&confirm('削除しますか？')){dishes=dishes.filter(d=>d.id!=b.dataset.del);save();render()}if(b.dataset.recipe)showRecipe(dishes.find(d=>d.id==b.dataset.recipe));if(b.dataset.assign){assign(Number(b.dataset.assign));render()}if(b.dataset.today){selectedDate=iso(new Date());assign(Number(b.dataset.today));render()}if(b.dataset.date){selectedDate=b.dataset.date;page='list';cat='すべて';$('#search').value='';render();scrollTo({top:0,behavior:'smooth'})}if(b.dataset.fcat){formCat=b.dataset.fcat;renderFormPicks()}if(b.dataset.fgenre){formGenres=formGenres.includes(b.dataset.fgenre)?formGenres.filter(x=>x!==b.dataset.fgenre):[...formGenres,b.dataset.fgenre];renderFormPicks()}if(b.dataset.theme){theme=b.dataset.theme;save();render();renderThemes()}});
$('#themeBtn').innerHTML=UI.brush;$('#settings').innerHTML=UI.settings;$('#listAddFixed').innerHTML=UI.plus+'<span>料理を追加する</span>';$('#listAddFixed').onclick=()=>openForm();$('#navList').innerHTML=UI.list;$('#navCalendar').innerHTML=UI.calendar;$('#navRecipe').innerHTML=UI.recipe;$('#navShopping').innerHTML=UI.shopping;$('#search').oninput=render;$('#themeBtn').onclick=()=>{renderThemes();open('#themeOv')};$('#settings').onclick=()=>open('#settingsOv');$$('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)close()});$('#form').onsubmit=e=>{e.preventDefault();let url=$('#fUrl').value.trim();if(url&&!/^https?:\/\//i.test(url))url='https://'+url;let v={name:$('#fName').value.trim(),category:formCat,genres:formGenres,ingredients:$('#fTags').value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean),materials:$('#fMaterials').value.trim(),recipe:$('#fRecipe').value.trim(),url};dishes=editing?dishes.map(d=>d.id===editing?{...d,...v}:d):[{id:Date.now(),...v,lastCooked:null},...dishes];save();close();render()};
$('#saveShuffleDate').onclick=()=>{let dt=$('#shuffleRegisterDate').value;if(!dt)return;selectedDate=dt;shuffled.forEach(d=>assign(d.id));selectedDate=null;close();render()};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({version:3,dishes,plans,shopping,theme},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='menu-stock-backup-'+iso(new Date())+'.json';a.click();URL.revokeObjectURL(a.href)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.dishes))throw 0;if(confirm('現在のデータをバックアップ内容で置き換えますか？')){dishes=x.dishes.map(d=>({...d,genres:d.genres||[],ingredients:d.ingredients||[],materials:d.materials||'',recipe:d.recipe||'',url:d.url||''}));plans=x.plans||{};shopping=Array.isArray(x.shopping)?x.shopping.map(i=>({...i,checked:!!i.checked})):shopping;theme=x.theme||theme;save();close();render()}}catch{alert('読み込めないファイルです')}};r.readAsText(f)};render();
</script></body></html>
