function listView(){let l=list();return `<div class="page">${selectedDate?`<div class="mode"><div class="between"><div><b>${new Date(selectedDate+'T00:00').toLocaleDateString('ja-JP')}に登録</b><div class="tiny muted">検索・絞り込み後、「この日に追加」を押してください</div></div><button class="pill" id="finish">完了</button></div></div>`:''}<section class="hero"><div class="between"><div><div class="tiny muted">${cat==='すべて'?'同じジャンルの主菜・副菜・汁物を選択':'選択中の条件から候補を選択'}</div><h2>ランダム献立</h2><div class="tiny muted">登録がないカテゴリは飛ばします</div></div><button class="spark" id="shuffle" aria-label="献立をシャッフル">${UI.sparkle}</button></div>${shuffled.length?`<div class="shuffle-results"><b class="tiny">#${shuffleGenre} の候補</b>${shuffled.map(d=>`<div class="shuffle-item"><span><small>${d.category}</small><br><b>${esc(d.name)}</b></span>${selectedDate?`<button class="action" data-assign="${d.id}">追加</button>`:''}</div>`).join('')}${selectedDate?'<button class="save" id="allAssign">すべて追加</button>':''}</div>`:''}</section><div class="scroller">${CATS.map(c=>`<button class="pill ${c===cat?'active':''}" data-cat="${c}" style="--accent:${color(c)}">${c===cat?'✓ ':''}${ICON[c]} ${c}</button>`).join('')}</div><div class="scroller" style="margin-top:0"><button class="pill genre ${genre==='すべて'?'active':''}" data-genre="すべて">全ジャンル</button>${GENRES.map(g=>`<button class="pill genre ${g===genre?'active':''}" data-genre="${g}">#${g}</button>`).join('')}</div><div class="toolbar"><b>${l.length}件</b><select id="sort"><option value="oldest">しばらく作っていない順</option><option value="newest">最近作った順</option><option value="name">料理名順</option></select></div><div class="cards">${l.length?l.map(card).join(''):'<div class="empty">該当する料理がありません</div>'}</div></div>`}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.classList.contains('close'))close();if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.cat){cat=b.dataset.cat;shuffled=[];render()}if(b.dataset.genre){genre=b.dataset.genre;shuffled=[];render()}if(b.dataset.edit)openForm(dishes.find(d=>d.id==b.dataset.edit));if(b.dataset.del&&confirm('削除しますか？')){dishes=dishes.filter(d=>d.id!=b.dataset.del);save();render()}if(b.dataset.recipe)showRecipe(dishes.find(d=>d.id==b.dataset.recipe));if(b.dataset.assign){assign(Number(b.dataset.assign));render()}if(b.dataset.today){selectedDate=iso(new Date());assign(Number(b.dataset.today));render()}if(b.dataset.date){selectedDate=b.dataset.date;page='list';cat='すべて';$('#search').value='';render();scrollTo({top:0,behavior:'smooth'})}if(b.dataset.fcat){formCat=b.dataset.fcat;renderFormPicks()}if(b.dataset.fgenre){formGenres=formGenres.includes(b.dataset.fgenre)?formGenres.filter(x=>x!==b.dataset.fgenre):[...formGenres,b.dataset.fgenre];renderFormPicks()}if(b.dataset.theme){theme=b.dataset.theme;save();render();renderThemes()}});
