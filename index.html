const addDays=(dt,n)=>{let d=new Date(dt+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
function monthWeeks(y,m){let out=[];if(monthStyle()){let days=new Date(y,m+1,0).getDate();for(let s=1,n=1;s<=days;s+=7,n++){let e=Math.min(s+6,days);out.push({n,len:e-s+1,start:iso(new Date(y,m,s)),end:iso(new Date(y,m,e)),y,m})}return out}
 let last=iso(new Date(y,m+1,0)),w=weekOf(iso(new Date(y,m,1))),n=1;while(w.start<=last){out.push({...w,n});n++;w=weekOf(addDays(w.end,1))}return out}
function weekOf(dt){let[y,m,d]=dt.split('-').map(Number);if(monthStyle())return{...monthWeeks(y,m-1)[Math.floor((d-1)/7)],y,m:m-1};
 let dd=new Date(y,m-1,d),off=(dd.getDay()-wsEff()+7)%7,s=new Date(y,m-1,d-off),e=new Date(y,m-1,d-off+6);return{n:0,len:7,start:iso(s),end:iso(e),y:s.getFullYear(),m:s.getMonth()}}
/* 5週間ずつ：起点日から35日ごとに区切る */
function ensureAnchor(){if(periodMode==='5w'&&!periodAnchor){let t=new Date();periodAnchor=weekOf(iso(new Date(t.getFullYear(),t.getMonth(),1))).start}}
const anchorDate=()=>weekOf(periodAnchor||iso(new Date(new Date().getFullYear(),new Date().getMonth(),1))).start;
function periodOf(dt){let a=anchorDate(),idx=Math.floor(dayDiff(weekOf(dt).start,a)/35),start=addDays(a,idx*35);return{start,end:addDays(start,34),weeks:[0,1,2,3,4].map(k=>({...weekOf(addDays(start,k*7)),n:k+1}))}}
ensureAnchor();
function weekList(w){return expenses.filter(x=>x.date>=w.start&&x.date<=w.end).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id)}
function bar(spent,target,col){let p=target>0?Math.min(100,spent/target*100):0,over=target>0&&spent>target;return`<div class="mbar"><i style="width:${p}%;background:${over?'#d96c6c':col}"></i></div>`}
function diffHtml(spent,target){if(!target)return'<span class="tiny muted">目標なし</span>';let d=target-spent;return d>=0?`<span class="diff ok">あと ${yen(d)}</span>`:`<span class="diff over">${yen(-d)} 超過</span>`}

function chips(attr,sel){return allCats().map(c=>`<button type="button" class="pill ${sel===c?'active':''}" ${attr}="${esc(c)}" style="--accent:${catColor(c)}">${sel===c?'✓ ':''}${esc(c)}</button>`).join('')}

return`<button class="mcard mweek" data-wk="${t}" style="margin-top:0"><div class="between"><span class="tiny muted">今週（${wHead(w)}）</span><span class="tiny" style="color:var(--primary);font-weight:900">計算画面 ›</span></div><div class="between" style="margin-top:4px"><b class="mtotal" style="font-size:24px">${yen(wt)}</b>${tg?`<span class="tiny muted">目標 ${yen(tg)}</span>`:''}</div>${tg?bar(wt,tg,'var(--primary)'):''}</button>

<div class="mcard"><div class="between"><b>今日の記録</b><b>${yen(sum(today))}</b></div>${today.length?today.map(x=>expRow(x,false)).join(''):'<div class="empty" style="padding:18px 10px;font-size:12px">まだ記録がありません</div>'}</div>`}

function readItem(){let m=shopMemo.find(x=>x.id==itemForm?.id);if(!m)return null;m.name=$('#iName').value.trim()||m.name;m.qty=$('#iQty').value.trim();m.cat=itemForm.cat;return m}

return`<div class="calendar-head"><button class="icon svgbtn" data-cw="-1" aria-label="前の週">${UI.left}</button><div style="text-align:center"><b>${wHead(w)}</b><div class="tiny muted">${w.y}年${w.m+1}月${cur?'・今週':''}</div></div><button class="icon svgbtn" data-cw="1" aria-label="次の週">${UI.right}</button></div>${cur?'':`<div style="text-align:center;margin-top:6px"><button class="linkbtn" data-cw="0">今週に戻る</button></div>`}

<div class="cat-row"><div class="between"><span class="cat-name"><i style="background:#8b8d97"></i>未分類</span><span class="tiny">使用 <b>${yen(un)}</b></span></div></div></div>`}

/* ---- 週・月 ---- */
function monthView(){let t=iso(new Date()),five=periodMode==='5w',head,ws,mExp,label,y,m,ym;
if(five){let p=periodOf(periodStart||t);ws=p.weeks;mExp=expenses.filter(x=>x.date>=p.start&&x.date<=p.end);label='5週間の食費 合計';let cur=t>=p.start&&t<=p.end;
 head=`<div class="calendar-head"><button class="icon svgbtn" data-pm="-1" aria-label="前の5週間">${UI.left}</button><div style="text-align:center"><b>${mdl(p.start)}〜${mdl(p.end)}</b><div class="tiny muted">${p.start.slice(0,4)}年・5週間${cur?'・今の期間':''}</div></div><button class="icon svgbtn" data-pm="1" aria-label="次の5週間">${UI.right}</button></div>${cur?'':`<div style="text-align:center;margin-top:6px"><button class="linkbtn" data-pm="0">今の期間に戻る</button></div>`}`}
else{y=moneyMonth.getFullYear();m=moneyMonth.getMonth();ym=`${y}-${String(m+1).padStart(2,'0')}`;mExp=expenses.filter(x=>x.date.slice(0,7)===ym);ws=monthWeeks(y,m);label=`${m+1}月の食費 合計`;
 head=`<div class="calendar-head"><button class="icon svgbtn" data-mm="-1" aria-label="前月">${UI.left}</button><b>${y}年 ${m+1}月</b><button class="icon svgbtn" data-mm="1" aria-label="翌月">${UI.right}</button></div>`}
let total=sum(mExp),tg=weekTarget(),rows=[...allCats(),''].map(c=>({c,v:sum(mExp.filter(x=>x.cat===c))})).filter(r=>r.v>0);
return`${head}
<div class="mcard"><div class="tiny muted">${label}</div><div class="mtotal">${yen(total)}</div><div class="tiny muted">${mExp.length}件の記録</div>${rows.length?`<div style="margin-top:12px">${rows.map(r=>{let p=total?Math.round(r.v/total*100):0;return`<div class="cat-row"><div class="between"><span class="cat-name"><i style="background:${catColor(r.c)}"></i>${esc(catName(r.c))}</span><span class="tiny"><b>${yen(r.v)}</b> <span class="muted">${p}%</span></span></div><div class="mbar"><i style="width:${p}%;background:${catColor(r.c)}"></i></div></div>`}).join('')}</div>`:''}</div>
<div class="between" style="margin-top:18px"><b>週ごと</b></div>
<div class="recipes" style="margin-top:8px">${ws.map(w=>{let v=sum(weekList(w)),cur=t>=w.start&&t<=w.end;return`<button class="mweek mcard ${cur?'cur':''}" data-wk="${w.start}" style="margin-top:0"><div class="between"><b>${wHead(w)}${cur?' <span class="tag genretag" style="--accent:var(--primary)">今週</span>':''}</b><b>${yen(v)}</b></div>${tg?`<div class="between tiny muted" style="margin-top:3px"><span>目標 ${yen(tg)}</span><span style="${v>tg?'color:#d96c6c;font-weight:900':''}">${v>tg?yen(v-tg)+' 超過':'残り '+yen(tg-v)}</span></div>${bar(v,tg,'var(--primary)')}`:''}</button>`}).join('')}</div>`}

<div class="mcard"><div class="between"><b>この週の記録</b><span class="tiny muted">${list.length}件</span></div>${list.length?list.map(x=>expRow(x,true)).join(''):'<div class="empty" style="padding:18px 10px;font-size:12px">まだ記録がありません</div>'}</div>
<button class="save" data-goto-cat="1" style="background:var(--soft);color:var(--primary);border:1px solid var(--primary)">カテゴリ別の差異を見る</button>`}

el.innerHTML=`<div class="section soft" style="margin-top:0"><b>食費の設定</b>

/* ---- イベント ---- */
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;
if(d.mtab){moneyTab=d.mtab;if(moneyTab==='cat')catWeek=null;if(moneyTab==='week')periodStart=null;render()}
if(d.pm!==undefined){let step=Number(d.pm);periodStart=step===0?null:addDays(periodOf(periodStart||iso(new Date())).start,step*35);render()}
if(d.mm){moneyMonth=new Date(moneyMonth.getFullYear(),moneyMonth.getMonth()+Number(d.mm),1);render()}
if(d.calmode){calMode=d.calmode;render()}
if(d.qcat!==undefined){readQuick();quick.cat=quick.cat===d.qcat?'':d.qcat;$('#qChips').innerHTML=chips('data-qcat',quick.cat)}
if(d.wk){openWeek(d.wk)}
if(d.wcat!==undefined){readWk();wkForm.cat=wkForm.cat===d.wcat?'':d.wcat;renderWeek()}
if(d.ecat!==undefined){expForm.cat=expForm.cat===d.ecat?'':d.ecat;renderECats()}
if(d.expEdit)openExp(d.expEdit);

function color(c){return A[theme][KEY[c]||'other']}function appSnapshot(){return{version:7,dishes,plans,expenses,budgets,moneyCats,shopMemo,weekStart,periodMode,periodAnchor,tagCats,tagCatList,pantry,theme,savedAt:new Date().toISOString()}}function save(){localStorage.setItem('menu-stock-dishes',JSON.stringify(dishes));localStorage.setItem('menu-stock-plans',JSON.stringify(plans));saveMoneyLocal();localStorage.setItem('menu-stock-pantry',JSON.stringify(pantry));localStorage.setItem('menu-stock-theme',theme);if(cloudUser&&cloudLinked)scheduleCloudSave()}function scheduleCloudSave(){clearTimeout(cloudTimer);cloudStatus='同期待ち';updateSyncUI();cloudTimer=setTimeout(()=>saveToCloud(false),900)}
function open(id){$(id).classList.add('open')}function close(){$$('.overlay').forEach(x=>x.classList.remove('open'))}function list(){let q=$('#search').value.trim(),x=dishes.filter(d=>(cat==='すべて'||d.category===cat)&&(genre==='すべて'||dishGenres(d).includes(genre))&&(!q||d.name.includes(q)||d.ingredients.some(i=>i.includes(q))||d.genres.some(g=>g.includes(q))));return x.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name,'ja'):sort==='added'?(Number(b.createdAt)||0)-(Number(a.createdAt)||0):sort==='newest'?(b.lastCooked||'').localeCompare(a.lastCooked||''):!a.lastCooked?-1:!b.lastCooked?1:(a.lastCooked||'').localeCompare(b.lastCooked||''))}
function setSync(status,error=''){cloudStatus=status;cloudError=error;updateSyncUI()}
function updateSyncUI(){let dot=$('#syncDot'),text=$('#syncText'),user=$('#syncUser'),actions=$('#syncActions'),warn=$('#syncWarning');if(!dot||!text||!actions)return;dot.className='sync-dot '+(cloudStatus==='保存済み'?'ok':cloudStatus.includes('中')||cloudStatus==='同期待ち'?'work':cloudError?'error':'');text.textContent=cloudStatus;user.textContent=cloudUser?`${cloudUser.email} でログイン中`:'';warn.innerHTML=cloudError?`<div class="sync-warning">${esc(cloudError)}</div>`:'';if(!cloudUser){actions.className='sync-actions';actions.innerHTML='<button class="sync-btn primary" id="loginBtn">ログイン</button>';$('#loginBtn').onclick=()=>open('#authOv');return}let cloudCount=Array.isArray(cloudRow?.app_data?.dishes)?cloudRow.app_data.dishes.length:0;let localCount=dishes.length;if(!cloudRow){actions.className='sync-actions';actions.innerHTML=`<button class="sync-btn primary" id="migrateBtn">現在のデータ ${localCount}件を初回保存</button><button class="sync-btn" id="logoutBtn">ログアウト</button>`;$('#migrateBtn').onclick=()=>saveToCloud(true);$('#logoutBtn').onclick=logoutCloud;warn.innerHTML='<div class="sync-warning">Supabase側は空です。「現在のデータを初回保存」を押すまで、自動同期は開始しません。</div>';return}actions.className='sync-actions two';actions.innerHTML=`<button class="sync-btn primary" id="uploadBtn">端末 → クラウド</button><button class="sync-btn" id="downloadBtn">クラウド → 端末</button><button class="sync-btn" id="logoutBtn" style="grid-column:1/3">ログアウト</button>`;$('#uploadBtn').onclick=()=>saveToCloud(false,true);$('#downloadBtn').onclick=restoreFromCloud;$('#logoutBtn').onclick=logoutCloud;if(!cloudLinked)warn.innerHTML=`<div class="sync-warning">クラウドに料理${cloudCount}件、端末に${localCount}件あります。内容を確認して、どちらを採用するか選んでください。</div>`}
async function initCloud(){if(!cloudClient){setSync('接続ライブラリを読み込めません','インターネット接続を確認してください。');return}let{data,error}=await cloudClient.auth.getSession();if(error){setSync('認証確認エラー',error.message);return}cloudUser=data.session?.user||null;if(cloudUser)await inspectCloud();else updateSyncUI();cloudClient.auth.onAuthStateChange(async(_event,session)=>{cloudUser=session?.user||null;if(cloudUser)await inspectCloud();else{cloudRow=null;cloudLinked=false;updateSyncUI()}})}
async function inspectCloud(){setSync('確認中');let{data,error}=await cloudClient.from('menu_stock_data').select('app_data,updated_at').eq('user_id',cloudUser.id).maybeSingle();if(error){cloudRow=null;setSync('接続エラー',`Supabaseを確認できませんでした：${error.message}`);return}cloudRow=data||null;if(cloudRow&&cloudLinked){setSync('保存済み');}else setSync(cloudRow?'同期方法を選択':'初回保存が必要');}
async function saveToCloud(first=false,manual=false){if(!cloudUser||cloudBusy)return;if(!first&&!cloudLinked&&!manual){setSync('初回保存が必要');return}if(first&&cloudRow&&!confirm('Supabaseには既にデータがあります。端末データで上書きしますか？'))return;if(!first&&manual&&!confirm(`端末の料理${dishes.length}件をクラウドへ保存しますか？`))return;cloudBusy=true;setSync('保存中');let snapshot=appSnapshot();let{data,error}=await cloudClient.from('menu_stock_data').upsert({user_id:cloudUser.id,app_data:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'}).select('app_data,updated_at').single();cloudBusy=false;if(error){setSync('保存失敗',`端末内には保存されています。クラウド保存に失敗しました：${error.message}`);return}let count=data?.app_data?.dishes?.length??-1;if(count!==dishes.length){setSync('件数確認エラー',`端末${dishes.length}件に対して、クラウドは${count}件でした。端末データは削除していません。`);return}cloudRow=data;cloudLinked=true;localStorage.setItem('menu-stock-cloud-linked','1');setSync('保存済み');}
async function restoreFromCloud(){if(!cloudRow?.app_data)return;let x=cloudRow.app_data,cloudCount=Array.isArray(x.dishes)?x.dishes.length:0;if(!confirm(`クラウドの料理${cloudCount}件をこの端末へ復元しますか？ 現在の端末データは先に自動バックアップされます。`))return;downloadJson(appSnapshot(),'menu-stock-before-cloud-restore-'+iso(new Date())+'.json');applySnapshot(x);cloudLinked=true;localStorage.setItem('menu-stock-cloud-linked','1');saveLocalOnly();setSync('保存済み');render()}
function applySnapshot(x){if(!Array.isArray(x.dishes))throw new Error('料理データがありません');dishes=x.dishes.map(d=>({...d,genres:d.genres||[],ingredients:d.ingredients||[],materials:d.materials||'',recipe:d.recipe||'',url:d.url||'',createdAt:Number(d.createdAt)||Number(d.id)||0}));plans=x.plans||{};applyMoney(x);pantry=Array.isArray(x.pantry)?x.pantry:[];theme=x.theme||theme}
function saveLocalOnly(){localStorage.setItem('menu-stock-dishes',JSON.stringify(dishes));localStorage.setItem('menu-stock-plans',JSON.stringify(plans));saveMoneyLocal();localStorage.setItem('menu-stock-pantry',JSON.stringify(pantry));localStorage.setItem('menu-stock-theme',theme)}
function downloadJson(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function logoutCloud(){clearTimeout(cloudTimer);await cloudClient.auth.signOut();cloudUser=null;cloudRow=null;cloudLinked=false;localStorage.removeItem('menu-stock-cloud-linked');setSync('未接続')}
function render(){document.documentElement.dataset.theme=theme;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#search').style.display=page==='list'?'block':'none';$('#listAddFixed').classList.toggle('show',page==='list');$('#view').innerHTML=page==='list'?listView():page==='calendar'?calendarView():page==='ingredients'?ingredientView():moneyView();bindDynamic()}
function listView(){let l=list();return `<div class="page">${selectedDate?`<div class="mode"><div class="between"><div><b>${new Date(selectedDate+'T00:00').toLocaleDateString('ja-JP')}に登録</b></div><button class="pill" id="finish">完了</button></div></div>`:''}<section class="hero"><div class="between"><div><h2>ランダム献立</h2></div><button class="spark" id="shuffle" aria-label="献立をシャッフル">${UI.sparkle}</button></div>${shuffled.length?`<div class="shuffle-results"><b class="tiny">#${shuffleGenre} の候補</b>${shuffled.map(d=>`<div class="shuffle-item"><span><small>${d.category}</small><br><b>${esc(d.name)}</b></span>${selectedDate?`<button class="action" data-assign="${d.id}">追加</button>`:''}</div>`).join('')}<button class="save" id="allAssign">${selectedDate?'すべて追加':'日付を選んで登録'}</button></div>`:''}</section><div class="filter-panel"><span class="filter-label">カテゴリ</span><div class="scroller">${CATS.map(c=>`<button class="pill ${c===cat?'active':''}" data-cat="${c}" style="--accent:${color(c)}">${c===cat?'✓ ':''}${ICON[c]} ${c}</button>`).join('')}</div><span class="filter-label" style="margin-top:7px">ジャンル</span><div class="scroller" style="margin-top:0"><button class="pill genre ${genre==='すべて'?'active':''}" data-genre="すべて">全ジャンル</button>${GENRES.map(g=>`<button class="pill genre ${g===genre?'active':''}" data-genre="${g}">#${g}</button>`).join('')}</div></div><div class="toolbar"><b>${l.length}件</b><select id="sort"><option value="oldest">しばらく作っていない順</option><option value="newest">最近作った順</option><option value="added">追加した順</option><option value="name">料理名順</option></select></div><div class="cards">${l.length?l.map(card).join(''):'<div class="empty">該当する料理がありません</div>'}</div></div>`}
function card(d){let c=color(d.category),already=selectedDate&&(plans[selectedDate]||[]).includes(d.id);return `<article class="card" style="--accent:${c}"><i class="bar"></i><div class="cardrow"><div class="caticon">${ICON[d.category]}</div><div class="grow"><div class="between"><div class="grow"><small style="color:${c};font-weight:900">${d.category}</small><div class="name">${esc(d.name)}</div></div><div class="tools"><button class="tool" data-edit="${d.id}" aria-label="編集">${UI.edit}</button><button class="tool" data-del="${d.id}" aria-label="削除">${UI.trash}</button></div></div><div class="tags">${d.genres.map(g=>`<span class="tag genretag">#${g}</span>`).join('')}</div><div class="tags">${d.ingredients.map(i=>`<span class="tag">${esc(i)}</span>`).join('')}</div>${d.materials||d.recipe||d.url?`<button class="linkbtn" data-recipe="${d.id}">${UI.recipe} レシピを見る</button>`:''}<div class="cardfoot"><div class="date"><small class="muted">最後に作った日</small><b>${fmt(d.lastCooked)}</b></div>${selectedDate?`<button class="action" data-assign="${d.id}" ${already?'disabled':''}>${already?'追加済み':'この日に追加'}</button>`:`<button class="action" data-today="${d.id}">今日に登録</button>`}</div></div></div></article>`}
function calendarView(){let y=month.getFullYear(),m=month.getMonth(),blank=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),cells=[...Array(blank).fill(null),...Array.from({length:days},(_,i)=>new Date(y,m,i+1))],detail=calendarDate?(calMode==='money'?moneyDayDetail(calendarDate):calendarDetail(calendarDate)):'';return `<div class="page"><div class="calendar-head"><button class="icon svgbtn" id="prev" aria-label="前月">${UI.left}</button><b>${y}年 ${m+1}月</b><button class="icon svgbtn" id="next" aria-label="翌月">${UI.right}</button></div><div class="seg" style="grid-template-columns:1fr 1fr;margin:12px 0 8px"><button data-calmode="menu" class="${calMode==='menu'?'active':''}">献立</button><button data-calmode="money" class="${calMode==='money'?'active':''}">食費</button></div><div class="week">${'日月火水木金土'.split('').map(x=>`<div>${x}</div>`).join('')}</div><div class="cal">${cells.map(d=>{if(!d)return'<div class="day"></div>';let dt=iso(d),items=(plans[dt]||[]).map(id=>dishes.find(x=>x.id===id)).filter(Boolean);return`<button class="day ${dt===iso(new Date())?'today':''} ${dt===calendarDate?'selected':''}" data-calendar-date="${dt}"><b>${d.getDate()}</b>${dayBody(dt,items)}</button>`}).join('')}</div>${detail}</div>`}function calendarDetail(dt){let items=(plans[dt]||[]).map(id=>dishes.find(x=>x.id===id)).filter(Boolean),label=new Date(dt+'T00:00').toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});return `<section class="calendar-detail"><div class="between"><div><small class="muted">選択中の日付</small><h3>${label}</h3></div><b>${items.length}品</b></div><div class="calendar-detail-list">${items.length?items.map(d=>`<div class="calendar-detail-item"><span class="caticon" style="--accent:${color(d.category)}">${ICON[d.category]}</span><span class="grow"><b>${esc(d.name)}</b><br><small class="muted">${d.category}</small></span><span class="calendar-actions">${d.materials||d.recipe||d.url?`<button class="calendar-recipe" data-recipe="${d.id}">レシピ</button>`:''}<button class="calendar-remove" data-plan-remove="${d.id}" data-plan-date="${dt}" aria-label="献立から削除">${UI.trash}</button></span></div>`).join(''):'<div class="empty" style="padding:20px 10px">この日の献立は未登録です</div>'}</div><button class="calendar-add" data-plan-add="${dt}">${UI.plus}<span>この日に料理を追加</span></button></section>`}function dishGenres(d){return d.genres&&d.genres.length?d.genres:['その他']}function shuffle(){let eligible=dishes.filter(d=>cat==='すべて'?SHUFFLE.includes(d.category):d.category===cat);let tg=genre;if(tg==='すべて'){let av=GENRES.filter(g=>eligible.some(d=>dishGenres(d).includes(g)));if(!av.length){shuffled=[];shuffleGenre='';alert('選択条件に合う料理がありません');render();return}tg=av[Math.floor(Math.random()*av.length)]}eligible=eligible.filter(d=>dishGenres(d).includes(tg));if(cat==='すべて'){shuffled=SHUFFLE.map(c=>{let p=eligible.filter(d=>d.category===c);return p.length?p[Math.floor(Math.random()*p.length)]:null}).filter(Boolean)}else shuffled=eligible.length?[eligible[Math.floor(Math.random()*eligible.length)]]:[];shuffleGenre=tg;if(!shuffled.length)alert('選択条件に合う料理がありません');render()}
function bindDynamic(){let s=$('#sort');if(s){s.value=sort;s.onchange=e=>{sort=e.target.value;render()}}$('#shuffle')&&($('#shuffle').onclick=shuffle);$('#finish')&&($('#finish').onclick=()=>{selectedDate=null;render()});$('#allAssign')&&($('#allAssign').onclick=()=>{if(selectedDate){shuffled.forEach(d=>assign(d.id));render()}else{$('#shuffleRegisterDate').value=iso(new Date());open('#shuffleDateOv')}});$('#prev')&&($('#prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()});$('#next')&&($('#next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()})}
function assign(id){if(!selectedDate)return;plans[selectedDate]=[...(plans[selectedDate]||[]).filter(x=>x!==id),id];dishes=dishes.map(d=>d.id===id?{...d,lastCooked:selectedDate}:d);save()}function latestPlannedDate(id){return Object.keys(plans).filter(dt=>(plans[dt]||[]).includes(id)).sort().pop()||null}function removeFromPlan(dt,id){plans[dt]=(plans[dt]||[]).filter(x=>x!==id);if(!plans[dt].length)delete plans[dt];dishes=dishes.map(d=>d.id===id?{...d,lastCooked:latestPlannedDate(id)}:d);save()}function openForm(d){editing=d?.id||null;formCat=d?.category||(cat==='すべて'?'主菜':cat);formGenres=d?.genres?[...d.genres]:(genre==='すべて'?[]:[genre]);$('#formTitle').textContent=d?'料理を編集':'料理を追加';$('#fName').value=d?.name||'';$('#fTags').value=d?.ingredients?.join('、')||'';$('#fMaterials').value=d?.materials||'';$('#fRecipe').value=d?.recipe||'';$('#fUrl').value=d?.url||'';renderFormPicks();open('#formOv')}
function renderFormPicks(){$('#fCats').innerHTML=CATS.slice(1).map(c=>`<button type="button" class="pick ${c===formCat?'active':''}" data-fcat="${c}" style="--accent:${color(c)}">${ICON[c]}<span>${c}</span></button>`).join('');$('#fGenres').innerHTML=GENRES.map(g=>`<button type="button" class="pill ${formGenres.includes(g)?'active':''}" data-fgenre="${g}" style="--accent:var(--primary)">${formGenres.includes(g)?'✓ ':''}${g}</button>`).join('')}
function openExternalRecipe(url){let u=String(url||'').trim();if(!u)return false;if(!/^https?:\/\//i.test(u))u='https://'+u;try{let parsed=new URL(u);if(!/^https?:$/.test(parsed.protocol))return false;let a=document.createElement('a');a.href=parsed.href;a.target='_blank';a.rel='noopener noreferrer';a.style.display='none';document.body.appendChild(a);a.click();a.remove();return true}catch(e){alert('レシピURLを開けませんでした。URLを確認してください。');return false}}
function showRecipe(d){$('#rTitle').textContent=d.name;$('#rContent').innerHTML=`${d.materials?`<div class="recipebox" style="background:var(--soft)"><b>詳しい材料・分量</b><br><br>${esc(d.materials)}</div>`:''}${d.recipe?`<div class="recipebox"><b>作り方</b><br><br>${esc(d.recipe)}</div>`:''}${d.url?`<button class="save" type="button" id="openExternalRecipe">外部レシピを開く</button>`:''}<button class="save" id="editRecipe">材料・作り方を編集</button>`;$('#editRecipe').onclick=()=>{close();openForm(d)};let ext=$('#openExternalRecipe');if(ext)ext.onclick=()=>openExternalRecipe(d.url);open('#recipeOv')}
function renderThemes(){$('#themes').innerHTML=Object.entries(TN).map(([k,n])=>{let v=THEME_PREVIEW[k],on=theme===k;return `<button class="theme-choice ${on?'selected':''}" data-theme="${k}" style="--theme-color:${A[k].all}"><span class="theme-preview" style="background:${v.bg}"><span class="theme-preview-icon">${UI[v.icon]}</span><span class="theme-dots">${v.dots.map(c=>`<i style="background:${c}"></i>`).join('')}</span></span><span class="theme-copy"><b>${n}</b><small>${v.note}</small></span><span class="theme-check">${on?'✓':''}</span></button>`}).join('')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.classList.contains('close'))b.closest('.overlay').classList.remove('open');if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.cat){cat=b.dataset.cat;shuffled=[];render()}if(b.dataset.genre){genre=b.dataset.genre;shuffled=[];render()}if(b.dataset.edit)openForm(dishes.find(d=>d.id==b.dataset.edit));if(b.dataset.del&&confirm('削除しますか？')){dishes=dishes.filter(d=>d.id!=b.dataset.del);save();render()}if(b.dataset.recipe){let d=dishes.find(d=>d.id==b.dataset.recipe);if(d?.url)openExternalRecipe(d.url);else if(d)showRecipe(d)}if(b.dataset.assign){assign(Number(b.dataset.assign));render()}if(b.dataset.today){selectedDate=iso(new Date());assign(Number(b.dataset.today));render()}if(b.dataset.calendarDate){calendarDate=b.dataset.calendarDate;render();setTimeout(()=>document.querySelector('.calendar-detail')?.scrollIntoView({behavior:'smooth',block:'nearest'}),0)}if(b.dataset.planAdd){selectedDate=b.dataset.planAdd;page='list';cat='すべて';genre='すべて';$('#search').value='';render();scrollTo({top:0,behavior:'smooth'})}if(b.dataset.planRemove){removeFromPlan(b.dataset.planDate,Number(b.dataset.planRemove));render()}if(b.dataset.fcat){formCat=b.dataset.fcat;renderFormPicks()}if(b.dataset.fgenre){formGenres=formGenres.includes(b.dataset.fgenre)?formGenres.filter(x=>x!==b.dataset.fgenre):[...formGenres,b.dataset.fgenre];renderFormPicks()}if(b.dataset.theme){theme=b.dataset.theme;save();render();renderThemes()}});
$('#themeBtn').innerHTML=UI.brush;$('#settings').innerHTML=UI.settings;$('#listAddFixed').innerHTML=UI.plus+'<span>料理を追加する</span>';$('#listAddFixed').onclick=()=>openForm();$('#navList').innerHTML=UI.list;$('#navCalendar').innerHTML=UI.calendar;$('#navRecipe').innerHTML=UI.pantry;$('#navMoney').innerHTML=UI.yen;$('#search').oninput=render;$('#themeBtn').onclick=()=>{renderThemes();open('#themeOv')};$('#settings').onclick=()=>{updateSyncUI();renderMoneySettings();open('#settingsOv')};$$('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)o.classList.remove('open')});$('#form').onsubmit=e=>{e.preventDefault();let url=$('#fUrl').value.trim();if(url&&!/^https?:\/\//i.test(url))url='https://'+url;let v={name:$('#fName').value.trim(),category:formCat,genres:formGenres,ingredients:$('#fTags').value.split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean),materials:$('#fMaterials').value.trim(),recipe:$('#fRecipe').value.trim(),url};dishes=editing?dishes.map(d=>d.id===editing?{...d,...v}:d):(()=>{let now=Date.now();return[{id:now,createdAt:now,...v,lastCooked:null},...dishes]})();save();close();render()};
$('#saveShuffleDate').onclick=()=>{let dt=$('#shuffleRegisterDate').value;if(!dt)return;selectedDate=dt;shuffled.forEach(d=>assign(d.id));selectedDate=null;close();render()};$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({version:7,dishes,plans,expenses,budgets,moneyCats,shopMemo,weekStart,periodMode,periodAnchor,tagCats,tagCatList,pantry,theme},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='menu-stock-backup-'+iso(new Date())+'.json';a.click();URL.revokeObjectURL(a.href)};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.dishes))throw 0;if(confirm('現在のデータをバックアップ内容で置き換えますか？')){dishes=x.dishes.map(d=>({...d,genres:d.genres||[],ingredients:d.ingredients||[],materials:d.materials||'',recipe:d.recipe||'',url:d.url||'',createdAt:Number(d.createdAt)||Number(d.id)||0}));plans=x.plans||{};applyMoney(x);pantry=Array.isArray(x.pantry)?x.pantry:pantry;theme=x.theme||theme;save();close();render()}}catch{alert('読み込めないファイルです')}};r.readAsText(f)};$('#authForm').onsubmit=async e=>{e.preventDefault();let email=$('#authEmail').value.trim(),password=$('#authPassword').value,msg=$('#authMessage'),btn=$('#authSubmit');btn.disabled=true;msg.textContent='ログイン中...';let{data,error}=await cloudClient.auth.signInWithPassword({email,password});btn.disabled=false;if(error){msg.textContent=error.message==='Email not confirmed'?'メールアドレスが未確認です。SupabaseのUsers画面で確認状態を確認してください。':'ログインできません：'+error.message;return}cloudUser=data.user;msg.textContent='ログインしました。';close();await inspectCloud();updateSyncUI()};initCloud();render();
</script></body></html>
